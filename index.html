<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tip Calculator</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --border: #2a2f3a;
      --input: #111318;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1a1d24;
        --muted: #5f6368;
        --accent: #1a73e8;
        --border: #dadce0;
        --input: #f8f9fa;
      }
    }
    body.light {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #1a1d24;
      --muted: #5f6368;
      --accent: #1a73e8;
      --border: #dadce0;
      --input: #f8f9fa;
    }
    body.dark {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --border: #2a2f3a;
      --input: #111318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; margin: 0; }
    button.toggle {
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      font-size: 1rem;
    }
    .tips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .tips button {
      border: 1px solid var(--border);
      background: var(--input);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 0;
      cursor: pointer;
      font-weight: 600;
    }
    .tips button.active {
      border-color: var(--accent);
      color: var(--accent);
      outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .results {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .row span { color: var(--muted); font-size: 0.9rem; }
    .row strong { font-size: 1.15rem; }
    .row.total strong { color: var(--accent); font-size: 1.4rem; }
    .hint { margin-top: 16px; font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body class="dark">
  <main class="card">
    <header>
      <h1>Tip Calculator</h1>
      <button class="toggle" id="themeBtn" type="button">Light mode</button>
    </header>

    <label for="bill">Bill amount ($)</label>
    <input id="bill" type="number" min="0" step="0.01" value="42.50" />

    <label for="tip">Tip percent (%)</label>
    <input id="tip" type="number" min="0" step="1" value="18" />
    <div class="tips" id="presets">
      <button type="button" data-tip="10">10%</button>
      <button type="button" data-tip="15">15%</button>
      <button type="button" data-tip="18" class="active">18%</button>
      <button type="button" data-tip="20">20%</button>
    </div>

    <label for="people">Split between</label>
    <input id="people" type="number" min="1" step="1" value="2" />

    <div class="results">
      <div class="row"><span>Tip</span><strong id="tipAmount">$0.00</strong></div>
      <div class="row"><span>Per person</span><strong id="perPerson">$0.00</strong></div>
      <div class="row total"><span>Total</span><strong id="total">$0.00</strong></div>
    </div>
    <p class="hint">Built with Cursor for MLH Hacktoberfest Challenge 1.</p>
  </main>
  <script>
    const bill = document.getElementById("bill");
    const tip = document.getElementById("tip");
    const people = document.getElementById("people");
    const tipAmount = document.getElementById("tipAmount");
    const perPerson = document.getElementById("perPerson");
    const totalEl = document.getElementById("total");
    const presets = document.getElementById("presets");
    const themeBtn = document.getElementById("themeBtn");

    function money(n) {
      return "$" + (isFinite(n) ? n : 0).toFixed(2);
    }

    function syncPreset() {
      const value = Number(tip.value);
      [...presets.querySelectorAll("button")].forEach((btn) => {
        btn.classList.toggle("active", Number(btn.dataset.tip) === value);
      });
    }

    function calc() {
      const billVal = Math.max(0, Number(bill.value) || 0);
      const tipPct = Math.max(0, Number(tip.value) || 0);
      const n = Math.max(1, Math.floor(Number(people.value) || 1));
      const tipVal = billVal * (tipPct / 100);
      const total = billVal + tipVal;
      tipAmount.textContent = money(tipVal);
      totalEl.textContent = money(total);
      perPerson.textContent = money(total / n);
      syncPreset();
    }

    presets.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-tip]");
      if (!btn) return;
      tip.value = btn.dataset.tip;
      calc();
    });

    [bill, tip, people].forEach((el) => el.addEventListener("input", calc));

    themeBtn.addEventListener("click", () => {
      const light = document.body.classList.toggle("light");
      document.body.classList.toggle("dark", !light);
      themeBtn.textContent = light ? "Dark mode" : "Light mode";
    });

    calc();
  </script>
</body>
</html>
